spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

logging.file.name=logs/jobportal.log
logging.level.root=INFO
logging.level.com.saurabh=DEBUG

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${PORT:8080}

springdoc.swagger-ui.use-root-path=true

# Spring Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-16-digit-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.data.redis.repositories.enabled=false
 
# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads/resumes}

# Actuator Health Check for Cloud / Docker
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Seed and Admin Configuration
app.seed-data.enabled=${SEED_DATA:false}
app.admin.email=${ADMIN_EMAIL:admin@jobportal.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.phone=${ADMIN_PHONE:9999999999}
app.admin.fullName=${ADMIN_FULL_NAME:System Administrator}
